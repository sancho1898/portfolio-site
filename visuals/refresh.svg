<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="220" rx="14" fill="#f5f7fa"/>
<g font-size="13" text-anchor="middle">
<rect x="40" y="70" width="180" height="80" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/><text x="130" y="103" fill="#1b2430">Last complete result</text><text x="130" y="125" font-size="11" fill="#5b6573">stays visible</text>
<rect x="270" y="70" width="180" height="80" rx="10" fill="#fff" stroke="#5b6573" stroke-width="2" stroke-dasharray="6 4"/><text x="360" y="103" fill="#1b2430">New load + checks</text><text x="360" y="125" font-size="11" fill="#5b6573">not shown yet</text>
<rect x="500" y="70" width="180" height="80" rx="10" fill="#1f7a4d"/><text x="590" y="103" fill="#fff">Swap when valid</text><text x="590" y="125" font-size="11" fill="#dcf3e6">only after acceptance</text>
</g>
<text x="360" y="195" font-size="12" text-anchor="middle" fill="#5b6573">Cold start with no valid data: show an honest unavailable state, never a fake success.</text>
<text x="360" y="30" font-size="12" text-anchor="middle" fill="#5b6573">ILLUSTRATIVE PLACEHOLDER: not a screenshot or real data</text>
</svg>